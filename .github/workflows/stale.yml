name: 'Close Stale Issues and PRs'

on:
  schedule:
    # Runs at 01:30 UTC every day
    - cron: '30 1 * * *'

permissions:
  # Need write access to issues and PRs to label/comment/close
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    # Workspace for sharing data between steps (if needed in the future)
    # Description: Shared workspace for stale issue/PR processing artifacts
    steps:
      - uses: actions/stale@v9
        with:
          # Comment to add when marking an issue as stale
          stale-issue-message: >
            This issue is stale because it has been open for 60 days with no activity. 
            Remove the stale label or comment, otherwise this will be closed in 7 days.
          # Comment to add when marking a PR as stale
          stale-pr-message: >
            This pull request is stale because it has been open for 60 days with no activity. 
            Remove the stale label or comment, otherwise this will be closed in 7 days.
          # Comment to add when closing an issue due to staleness
          close-issue-message: >
            This issue was closed because it has been inactive for 7 days after being marked as stale.
          # Comment to add when closing a PR due to staleness
          close-pr-message: >
            This pull request was closed because it has been inactive for 7 days after being marked as stale.
          # Number of days of inactivity before marking as stale
          days-before-stale: 60
          # Number of days of inactivity before closing a stale item
          days-before-close: 7
          # The label to apply when marking as stale
          stale-issue-label: 'Stale'
          stale-pr-label: 'Stale'
          # Exempt items with these labels (comma-separated)
          # exempt-issue-labels: 'pinned,security'
          # exempt-pr-labels: 'pinned,security'
          # You can add more exemptions or configurations here if needed 